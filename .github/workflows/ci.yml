name: CI — InternHub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend lint + build check ──────────────────────────────────────────────
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check app starts (syntax check)
        run: node --check src/index.js

  # ─── Frontend lint + build ────────────────────────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        run: echo "REACT_APP_API_URL=https://placeholder.onrender.com/api" > .env

      - name: Build React app
        run: npm run build

  # ─── Deploy gate — only on main after both jobs pass ─────────────────────────
  deploy-gate:
    name: Deploy Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: All checks passed — Vercel + Render auto-deploy triggered
        run: echo "✅ CI passed. Vercel and Render will auto-deploy from main."
