name: Refresh Internships

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh-internships:
    name: Refresh Internships Every 6 Hours
    runs-on: ubuntu-latest

    steps:
      - name: Refresh internships via backend
        run: |
          curl --fail --show-error -X POST "${{ secrets.BACKEND_URL }}/internal/refresh" \
            -H "Content-Type: application/json" \
            -H "x-trigger-secret: ${{ secrets.REFRESH_TRIGGER_SECRET }}" \
            -d '{}'
