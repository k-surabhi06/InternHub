# render.yaml — Infrastructure-as-code for Render deployment

services:
  # ─── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: internhub-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # ← paste Neon POOLER URL in Render dashboard
      - key: DIRECT_URL
        sync: false          # ← paste Neon DIRECT URL in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false          # ← paste your Vercel frontend URL after Step 5
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # ← paste from cloudinary.com dashboard
      - key: CLOUDINARY_API_KEY
        sync: false          # ← paste from cloudinary.com dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false          # ← paste from cloudinary.com dashboard

  # ─── Ingestion scheduler (background worker) ─────────────────────────────────
  - type: worker
    name: internhub-scheduler
    runtime: node
    rootDir: backend/ingestion
    buildCommand: npm install && pip install -r requirements.txt
    startCommand: node scheduler.js
    envVars:
      - key: DATABASE_URL
        sync: false          # ← same Neon POOLER URL as the backend
